media:
  - name: images
    label: 网站图片
    input: public/images/uploads
    output: /images/uploads
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif, svg]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "新增内容：{path}"
      update: "更新内容：{path}"
      rename: "调整内容地址：{oldPath} -> {newPath}"

content:
  - name: cases
    label: 案例
    type: collection
    path: portfolio
    exclude: [index.md]
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: create
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, status, createdAt, verificationStatus]
      sort: createdAt
      order: asc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: slug
        label: 英文地址
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: 只能使用小写英文、数字和短横线
      - name: description
        label: 卡片摘要
        type: text
        required: true
      - name: createdAt
        label: 创建时间
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: status
        label: 发布状态
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: 草稿（不公开）
            - name: planned
              label: 筹备中（显示占位卡）
            - name: published
              label: 已发布
            - name: archived
              label: 已归档（不公开）
      - name: verificationStatus
        label: 验证状态
        type: select
        default: 已整理
        options:
          values: [探索中, 已整理, 已验证, 长期维护]
      - name: showInRecentUpdates
        label: 计入首页最近更新
        type: boolean
        default: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: cover
        label: 卡片封面
        type: image
        options:
          media: images
      - name: coverAlt
        label: 封面图片说明
        type: string
      - name: pageClass
        label: 页面样式标识
        type: string
        default: page-case-detail
        hidden: true
      - name: body
        label: 详情正文
        type: rich-text
        required: true

