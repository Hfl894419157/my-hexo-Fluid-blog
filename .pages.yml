              message: 请先保存草稿。全部重新识别会覆盖可自动识别字段，但不会覆盖自定义封面。
              button: 开始识别
            fields:
              - name: mode
                label: 识别方式
                type: select
                required: true
                default: fill_empty
                options:
                  - { label: 仅补充空白（推荐）, value: fill_empty }
                  - { label: 更新未被人工修改的自动字段, value: refresh_auto }
                  - { label: 全部重新识别, value: overwrite_all }
          - name: duplicate-content
            label: 复制为新草稿
            scope: entry
            workflow: duplicate-content.yml
            ref: current
            cancelable: false
            confirm: { title: 复制当前研究笔记？, message: 新副本会自动设为草稿并重新生成编号。, button: 创建副本 }
            fields:
              - { name: title, label: 新标题, type: text, required: true }
              - { name: filename, label: 新文件名（小写英文、数字、短横线）, type: text, required: true }
        view:
          primary: meta.title
          fields: [meta.title, publishing.status, publishing.createdAt, publishing.verificationStatus]
