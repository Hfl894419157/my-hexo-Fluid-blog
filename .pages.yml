media:
  - name: images
    label: 网站图片
    input: public/images/uploads
    output: /images/uploads
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif, svg]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "新增内容：{path}"
      update: "更新内容：{path}"
      rename: "调整内容地址：{oldPath} -> {newPath}"

components:
  content_id:
    label: 内容唯一编号
    type: uuid
    required: true
    hidden: true
    options:
      editable: false
      generate: false

  content_meta:
    label: 基本信息
    type: object
    required: true
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 卡片摘要
        type: text
        required: true
      - name: tags
        label: 标签
        type: string
        list: true

  content_publishing:
    label: 发布设置
    type: object
    required: true
    fields:
      - name: createdAt
        label: 创建日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: status
        label: 发布状态
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: 草稿（不公开）
            - name: planned
              label: 筹备中（显示占位卡）
            - name: published
              label: 已发布
            - name: archived
              label: 已归档（不公开）
      - name: verificationStatus
        label: 验证状态
        type: select
        default: 已整理
        options:
          values: [探索中, 已整理, 已验证, 长期维护]
      - name: showInRecentUpdates
        label: 计入首页最近更新
        type: boolean
        default: true

  content_cover:
    label: 卡片与封面
    type: object
    fields:
      - name: src
        label: 封面图片
        type: image
        options:
          media: images
      - name: alt
        label: 封面替代文字
        type: string

  content_seo:
    label: 高级设置
    type: object
    fields:
      - name: title
        label: SEO 标题（可选）
        type: string
      - name: description
        label: SEO 描述（可选）
        type: text

  enrichment_state:
    label: 识别记录
    type: object
    hidden: true
    fields:
      - { name: sourceHash, label: 来源指纹, type: string }
      - { name: status, label: 识别状态, type: string }
      - { name: message, label: 识别说明, type: text }
      - name: autoValues
        label: 上次自动字段
        type: object
        fields:
          - { name: url, type: string }
          - { name: platform, type: string }
          - { name: title, type: string }
          - { name: summary, type: text }
          - { name: tags, type: string, list: true }
          - { name: platformCover, type: string }
          - { name: duration, type: string }
          - { name: aspect, type: string }
          - { name: code, type: string }
          - { name: name, type: string }
          - { name: format, type: string }
          - { name: size, type: string }

  content_blocks:
    label: 内容模块
    description: 可新增、复制、排序、折叠或删除模块；模块标识由系统自动生成。
    type: block
    blockKey: type
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {type}"
    blocks:
      - name: richText
        label: Markdown 图文
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: markdown
            label: 图文正文
            type: rich-text
            required: true
      - name: image
        label: 单张图片
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: src
            label: 图片
            type: image
            required: true
            options:
              media: images
          - name: alt
            label: 替代文字
            type: string
            required: true
          - name: caption
            label: 图片说明
            type: text
      - name: gallery
        label: 图片组
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: items
            label: 图片列表
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {alt}"
            fields:
              - name: src
                label: 图片
                type: image
                required: true
                options:
                  media: images
              - name: alt
                label: 替代文字
                type: string
                required: true
              - name: caption
                label: 图片说明
                type: text
      - name: video
        label: 视频
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: rawInput
            label: 原始分享文案
            type: text
          - name: url
            label: 视频链接
            type: string
          - name: platform
            label: 平台
            type: select
            options:
              values: [youtube, bilibili, tencent, youku, douyin, xiaohongshu, wechat, external]
          - name: title
            label: 视频标题
            type: string
          - name: summary
            label: 视频说明
            type: text
          - name: tags
            label: 视频标签
            type: string
            list: true
          - name: platformCover
            label: 自动封面
            type: image
            options:
              media: images
          - name: customCover
            label: 自定义封面（优先）
            type: image
            options:
              media: images
          - name: duration
            label: 时长
            type: string
          - name: aspect
            label: 画面比例
            type: select
            default: "16:9"
            options:
              values: ["16:9", "4:3", "1:1", "9:16"]
          - { name: _enrichment, component: enrichment_state }
      - name: download
        label: 网盘资源
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: rawInput
            label: 原始分享文案
            type: text
          - name: url
            label: 分享链接
            type: string
          - name: platform
            label: 网盘平台
            type: select
            options:
              values: [baidu, aliyun, quark, pan123, lanzou, external]
          - name: code
            label: 提取码 / 访问码
            type: string
          - name: name
            label: 资源名称
            type: string
          - name: summary
            label: 资源说明
            type: text
          - name: format
            label: 文件格式
            type: string
          - name: size
            label: 文件大小
            type: string
          - name: platformCover
            label: 自动封面
            type: image
            options:
              media: images
          - name: customCover
            label: 自定义封面（优先）
            type: image
            options:
              media: images
          - name: buttonLabel
            label: 按钮文字
            type: string
            default: 打开资源
          - { name: _enrichment, component: enrichment_state }
      - name: externalLink
        label: 外部链接卡片
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: url
            label: 链接
            type: string
          - name: title
            label: 标题
            type: string
          - name: summary
            label: 说明
            type: text
          - name: cover
            label: 封面
            type: image
            options:
              media: images
          - name: buttonLabel
            label: 按钮文字
            type: string
            default: 访问链接

content:
  - name: cases
    label: 案例
    type: collection
    path: portfolio
    exclude: [index.md]
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: true
    operations: { create: true, rename: true, delete: true }
    actions:
      - name: enrich-content
        label: 识别内容模块
        scope: entry
        workflow: enrich-content.yml
        ref: current
        cancelable: false
        confirm:
          title: 识别当前内容模块？
          message: 请先保存草稿。全部重新识别会覆盖可自动识别字段，但不会覆盖自定义封面。
          button: 开始识别
        fields:
          - name: mode
            label: 识别方式
            type: select
            required: true
            default: fill_empty
            options:
              - { label: 仅补充空白（推荐）, value: fill_empty }
              - { label: 更新未被人工修改的自动字段, value: refresh_auto }
              - { label: 全部重新识别, value: overwrite_all }

    view:
      primary: meta.title
      fields: [meta.title, publishing.status, publishing.createdAt, publishing.verificationStatus]
      sort: [publishing.createdAt, meta.title]
      search: [meta.title, meta.description, meta.tags]
      default: { sort: publishing.createdAt, order: desc }
    fields:
      - { name: contentId, component: content_id }
      - { name: meta, component: content_meta }
      - { name: publishing, component: content_publishing }
      - { name: cover, component: content_cover }
      - { name: contentBlocks, component: content_blocks }
      - { name: seo, component: content_seo }

  - name: workflows
