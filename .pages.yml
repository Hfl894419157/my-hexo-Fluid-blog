media:
  - name: images
    label: 网站图片
    input: public/images/uploads
    output: /images/uploads
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif, svg]
    rename: safe
  - name: documents
    label: 简历与文档
    input: public/files
    output: /files
    categories: [document]
    extensions: [pdf]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "新增内容：{path}"
      update: "更新内容：{path}"
      rename: "调整内容地址：{oldPath} -> {newPath}"

components:
  about_icon:
    label: 图标
    type: select
    required: true
    options:
      values:
        - { label: 调色板 / 平面设计, value: palette }
        - { label: 立方体 / 三维, value: cube }
        - { label: 相机 / 摄影, value: camera }
        - { label: 流程 / AIGC, value: flow }
        - { label: 影片 / 视频, value: video }
        - { label: 浏览器 / 网站, value: web }

  resume_metric_icon:
    label: 履历指标图标
    type: select
    required: true
    options:
      values:
        - { label: 时间 / 从业经验, value: experience }
        - { label: 影片 / 内容产出, value: content }
        - { label: 流程 / 全链路, value: delivery }

  content_id:
    label: 内容唯一编号
    type: uuid
    required: true
    hidden: true
    options:
      editable: false
      generate: false

  content_meta:
    label: 基本信息
    type: object
    required: true
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 卡片摘要
        type: text
        required: true
      - name: tags
        label: 标签
        type: string
        list: true

  content_publishing:
    label: 发布设置
    type: object
    required: true
    fields:
      - name: createdAt
        label: 创建日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: status
        label: 发布状态
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: 草稿（不公开）
            - name: planned
              label: 筹备中（显示占位卡）
            - name: published
              label: 已发布
            - name: archived
              label: 已归档（不公开）
      - name: verificationStatus
        label: 验证状态
        type: select
        default: 已整理
        options:
          values: [探索中, 已整理, 已验证, 长期维护]
      - name: showInRecentUpdates
        label: 计入首页最近更新
        type: boolean
        default: true

  content_cover:
    label: 卡片与封面
    type: object
    fields:
      - name: src
        label: 封面图片
        type: image
        options:
          media: images
      - name: alt
        label: 封面替代文字
        type: string
      - name: focalPoint
        label: 封面焦点位置
        description: 自动裁剪时保留的主体位置；旧内容默认居中。
        type: select
        default: center
        options:
          values:
            - { label: 左上, value: top-left }
            - { label: 上, value: top }
            - { label: 右上, value: top-right }
            - { label: 左, value: left }
            - { label: 中, value: center }
            - { label: 右, value: right }
            - { label: 左下, value: bottom-left }
            - { label: 下, value: bottom }
            - { label: 右下, value: bottom-right }
      - name: homeOverrideSrc
        label: 首页专用封面（可选）
        description: 仅在自动裁剪不理想时上传；留空会继续使用上方原图。
        type: image
        options:
          media: images

  content_seo:
    label: 高级设置
    type: object
    fields:
      - name: title
        label: SEO 标题（可选）
        type: string
      - name: description
        label: SEO 描述（可选）
        type: text

  project_meta:
    label: 项目资料（可选）
    type: object
    fields:
      - { name: role, label: 我的角色, type: string }
      - { name: year, label: 项目年份, type: string }
      - { name: client, label: 客户 / 品牌, type: string }
      - { name: services, label: 服务内容, type: string, list: true }
      - { name: outcome, label: 项目成果, type: text }

  resource_meta:
    label: 资源属性
    type: object
    fields:
      - name: type
        label: 资源类型
        type: select
        required: true
        default: other
        options:
          values:
            - { label: 软件, value: software }
            - { label: AI 工具, value: ai-tool }
            - { label: 插件, value: plugin }
            - { label: Prompt, value: prompt }
            - { label: 模板, value: template }
            - { label: 素材, value: asset }
            - { label: 文档, value: document }
            - { label: 其他, value: other }
      - name: access
        label: 获取方式
        type: select
        required: true
        default: contact
        options:
          values:
            - { label: 访问官网, value: official }
            - { label: 网盘下载, value: cloud }
            - { label: 联系获取, value: contact }
      - { name: platform, label: 平台 / 来源, type: string }
      - { name: licenseNote, label: 授权与版权说明, type: text }

  enrichment_state:
    label: 识别记录
    type: object
    hidden: true
    fields:
      - { name: sourceHash, label: 来源指纹, type: string }
      - { name: status, label: 识别状态, type: string }
      - { name: message, label: 识别说明, type: text }
      - name: autoValues
        label: 上次自动字段
        type: object
        fields:
          - { name: url, type: string }
          - { name: platform, type: string }
          - { name: title, type: string }
          - { name: summary, type: text }
          - { name: tags, type: string, list: true }
          - { name: platformCover, type: string }
          - { name: duration, type: string }
          - { name: aspect, type: string }
          - { name: code, type: string }
          - { name: name, type: string }
          - { name: format, type: string }
          - { name: size, type: string }

  content_blocks:
    label: 正文内容
    description: 支持文字排版、图片粘贴、视频链接和网盘链接；外部图片会由增强后台自动归档。
    type: block
    blockKey: type
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {type}"
    blocks:
      - name: richText
        label: 正文
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: format
            label: 正文格式
            type: string
            hidden: true
            default: html
          - name: html
            label: 正文
            description: 直接粘贴文字、图片、视频链接或网盘链接，系统会自动识别并渲染。
            type: rich-text
            required: true
            options:
              format: html
              switcher: true
              media: images
              path: public/images/uploads/imported
              rename: random
          - name: legacyMarkdown
            label: 旧版 Markdown（回退）
            type: text
            hidden: true
            readonly: true

  portfolio_content_blocks:
    label: 作品内容
    description: 正文说明支持图片粘贴和视频/网盘链接；图片组可拖动排序。
    type: block
    blockKey: type
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {type}"
    blocks:
      - name: richText
        label: 正文说明
        fields:
          - { name: id, label: 模块标识, type: uuid, hidden: true }
          - { name: format, label: 正文格式, type: string, hidden: true, default: html }
          - name: html
            label: 正文
            type: rich-text
            required: true
            description: 支持文字、图片粘贴、视频链接和网盘链接。
            options: { format: html, switcher: true, media: images, path: public/images/uploads/imported, rename: random }
          - { name: legacyMarkdown, label: 旧版 Markdown（回退）, type: text, hidden: true, readonly: true }
      - name: gallery
        label: 作品图片组
        fields:
          - { name: id, label: 模块标识, type: uuid, hidden: true }
          - name: items
            label: 作品图片（可拖动排序）
            type: object
            required: true
            list:
              min: 1
              batch: true
              collapsible:
                collapsed: true
                summary: "{index}. {alt}"
            fields:
              - { name: id, label: 图片标识, type: uuid, hidden: true }
              - { name: src, label: 图片, type: image, required: true, options: { media: images } }
              - { name: alt, label: 替代文字, type: string, required: true }
              - { name: caption, label: 图片说明（可选）, type: text }

content:
  - name: cases
    label: 作品集
    type: collection
    path: portfolio
    exclude: [index.md]
    format: yaml-frontmatter
    filename:
      template: "{primary}-{year}{month}{day}-{hour}{minute}{second}{millisecond}.md"
      field: false
    operations: { create: true, rename: false, delete: true }
    actions:
      - name: enrich-content
        label: 识别内容模块
        scope: entry
        workflow: enrich-content.yml
        ref: current
        cancelable: false
        confirm:
          title: 识别当前内容模块？
          message: 请先保存草稿。全部重新识别会覆盖可自动识别字段，但不会覆盖自定义封面。
          button: 开始识别
        fields:
          - name: mode
            label: 识别方式
            type: select
            required: true
            default: fill_empty
            options:
              - { label: 仅补充空白（推荐）, value: fill_empty }
              - { label: 更新未被人工修改的自动字段, value: refresh_auto }
              - { label: 全部重新识别, value: overwrite_all }
      - name: duplicate-content
        label: 复制为新草稿
        scope: entry
        workflow: duplicate-content.yml
        ref: current
        cancelable: false
        confirm:
          title: 复制当前作品为新草稿？
          message: 系统会重新生成内容编号和模块编号，不会覆盖原作品。
          button: 创建副本
        fields:
          - { name: title, label: 新标题, type: text, required: true }

    view:
      primary: meta.title
      fields: [meta.title, publishing.status, publishing.createdAt, publishing.verificationStatus]
      sort: [publishing.createdAt, meta.title]
      search: [meta.title, meta.description, meta.tags]
      default: { sort: publishing.createdAt, order: desc }
    fields:
      - { name: contentId, component: content_id }
      - { name: meta, component: content_meta }
      - { name: cover, component: content_cover }
      - { name: contentBlocks, component: portfolio_content_blocks }
      - { name: publishing, component: content_publishing }
      - name: advanced
        label: 高级设置（可选）
        type: object
        collapsed: true
        fields:
          - { name: project, component: project_meta }
          - { name: seo, component: content_seo }

  - name: workflows
    label: 工作流
    type: collection
    path: aigc
    exclude: [index.md]
    format: yaml-frontmatter
    filename:
      template: "{primary}-{year}{month}{day}-{hour}{minute}{second}{millisecond}.md"
      field: false
    operations: { create: true, rename: false, delete: true }
    actions:
      - name: enrich-content
        label: 识别内容模块
        scope: entry
        workflow: enrich-content.yml
        ref: current
        cancelable: false
        confirm:
          title: 识别当前内容模块？
          message: 请先保存草稿。全部重新识别会覆盖可自动识别字段，但不会覆盖自定义封面。
          button: 开始识别
        fields:
          - name: mode
            label: 识别方式
            type: select
            required: true
            default: fill_empty
            options:
              - { label: 仅补充空白（推荐）, value: fill_empty }
              - { label: 更新未被人工修改的自动字段, value: refresh_auto }
              - { label: 全部重新识别, value: overwrite_all }
      - name: duplicate-content
        label: 复制为新草稿
        scope: entry
        workflow: duplicate-content.yml
        ref: current
        cancelable: false
        confirm:
          title: 复制当前工作流为新草稿？
          message: 系统会重新生成内容编号和模块编号，不会覆盖原工作流。
          button: 创建副本
        fields:
          - { name: title, label: 新标题, type: text, required: true }

    view:
      primary: meta.title
      fields: [meta.title, publishing.status, publishing.createdAt, publishing.verificationStatus]
      sort: [publishing.createdAt, meta.title]
      search: [meta.title, meta.description, meta.tags]
      default: { sort: publishing.createdAt, order: desc }
    fields:
      - { name: contentId, component: content_id }
      - { name: meta, component: content_meta }
      - { name: publishing, component: content_publishing }
      - { name: cover, component: content_cover }
      - { name: contentBlocks, component: content_blocks }
      - { name: seo, component: content_seo }

  - name: knowledge_content
    label: 知识库内容
    type: group
    items:
      - name: learning_entries
        label: 研究笔记
        type: collection
        path: knowledge/learning-observation
        format: yaml-frontmatter
        filename:
          template: "{primary}-{year}{month}{day}-{hour}{minute}{second}{millisecond}.md"
          field: false
        operations: { create: true, rename: false, delete: true }
        actions:
          - name: enrich-content
            label: 识别内容模块
            scope: entry
            workflow: enrich-content.yml
            ref: current
            cancelable: false
            confirm:
              title: 识别当前内容模块？
              message: 请先保存草稿。全部重新识别会覆盖可自动识别字段，但不会覆盖自定义封面。
              button: 开始识别
            fields:
              - name: mode
                label: 识别方式
                type: select
                required: true
                default: fill_empty
                options:
                  - { label: 仅补充空白（推荐）, value: fill_empty }
                  - { label: 更新未被人工修改的自动字段, value: refresh_auto }
                  - { label: 全部重新识别, value: overwrite_all }
          - name: duplicate-content
            label: 复制为新草稿
            scope: entry
            workflow: duplicate-content.yml
            ref: current
            cancelable: false
            confirm: { title: 复制当前研究笔记？, message: 新副本会自动设为草稿并重新生成编号。, button: 创建副本 }
            fields:
              - { name: title, label: 新标题, type: text, required: true }
        view:
          primary: meta.title
          fields: [meta.title, publishing.status, publishing.createdAt, publishing.verificationStatus]
          sort: [publishing.createdAt, meta.title]
          search: [meta.title, meta.description, meta.tags]
          default: { sort: publishing.createdAt, order: desc }
        fields:
          - { name: contentId, component: content_id }
          - { name: meta, component: content_meta }
          - { name: publishing, component: content_publishing }
          - { name: cover, component: content_cover }
          - { name: contentBlocks, component: content_blocks }
          - { name: seo, component: content_seo }

      - name: method_entries
        label: 方法指南
        type: collection
        path: knowledge/methods
        format: yaml-frontmatter
        filename:
          template: "{primary}-{year}{month}{day}-{hour}{minute}{second}{millisecond}.md"
          field: false
        operations: { create: true, rename: false, delete: true }
        actions:
          - name: enrich-content
            label: 识别内容模块
            scope: entry
            workflow: enrich-content.yml
            ref: current
            cancelable: false
            confirm:
              title: 识别当前内容模块？
              message: 请先保存草稿。全部重新识别会覆盖可自动识别字段，但不会覆盖自定义封面。
              button: 开始识别
            fields:
              - name: mode
                label: 识别方式
                type: select
                required: true
                default: fill_empty
                options:
                  - { label: 仅补充空白（推荐）, value: fill_empty }
                  - { label: 更新未被人工修改的自动字段, value: refresh_auto }
                  - { label: 全部重新识别, value: overwrite_all }
          - name: duplicate-content
            label: 复制为新草稿
            scope: entry
            workflow: duplicate-content.yml
            ref: current
            cancelable: false
            confirm: { title: 复制当前方法指南？, message: 新副本会自动设为草稿并重新生成编号。, button: 创建副本 }
            fields:
              - { name: title, label: 新标题, type: text, required: true }
        view:
          primary: meta.title
          fields: [meta.title, publishing.status, publishing.createdAt, publishing.verificationStatus]
          sort: [publishing.createdAt, meta.title]
          search: [meta.title, meta.description, meta.tags]
          default: { sort: publishing.createdAt, order: desc }
        fields:
          - { name: contentId, component: content_id }
          - { name: meta, component: content_meta }
          - { name: publishing, component: content_publishing }
          - { name: cover, component: content_cover }
          - { name: contentBlocks, component: content_blocks }
          - { name: seo, component: content_seo }

      - name: resource_entries
        label: 工具与资源
        type: collection
        path: knowledge/resources
        format: yaml-frontmatter
        filename:
          template: "{primary}-{year}{month}{day}-{hour}{minute}{second}{millisecond}.md"
          field: false
        operations: { create: true, rename: false, delete: true }
        actions:
          - name: enrich-content
            label: 识别内容模块
            scope: entry
            workflow: enrich-content.yml
            ref: current
            cancelable: false
            confirm:
              title: 识别当前内容模块？
              message: 请先保存草稿。全部重新识别会覆盖可自动识别字段，但不会覆盖自定义封面。
              button: 开始识别
            fields:
              - name: mode
                label: 识别方式
                type: select
                required: true
                default: fill_empty
                options:
                  - { label: 仅补充空白（推荐）, value: fill_empty }
                  - { label: 更新未被人工修改的自动字段, value: refresh_auto }
                  - { label: 全部重新识别, value: overwrite_all }
          - name: duplicate-content
            label: 复制为新草稿
            scope: entry
            workflow: duplicate-content.yml
            ref: current
            cancelable: false
            confirm: { title: 复制当前资源？, message: 新副本会自动设为草稿并重新生成编号。, button: 创建副本 }
            fields:
              - { name: title, label: 新标题, type: text, required: true }
        view:
          primary: meta.title
          fields: [meta.title, publishing.status, publishing.createdAt, publishing.verificationStatus]
          sort: [publishing.createdAt, meta.title]
          search: [meta.title, meta.description, meta.tags, resourceMeta.type, resourceMeta.access]
          default: { sort: publishing.createdAt, order: desc }
        fields:
          - { name: contentId, component: content_id }
          - { name: meta, component: content_meta }
          - { name: publishing, component: content_publishing }
          - { name: cover, component: content_cover }
          - { name: resourceMeta, component: resource_meta }
          - { name: contentBlocks, component: content_blocks }
          - { name: seo, component: content_seo }

  - name: site_management
    label: 站点管理
    type: group
    items:
      - name: homepage
        label: 首页内容
        type: file
        path: .shared/content/home.json
        format: json
        operations: { delete: false }
        fields:
          - name: featuredCases
            label: 首页作品精选
            type: reference
            options:
              collection: cases
              multiple: true
              max: 2
              search: "meta.title,meta.description,meta.tags,publishing.status"
              value: "{fields.contentId}"
              label: "{fields.meta.title} · {fields.publishing.status}"
          - name: featuredWorkflows
            label: 精选工作流（最多 3 条）
            type: reference
            options:
              collection: workflows
              multiple: true
              max: 3
              search: "meta.title,meta.description,meta.tags,publishing.status"
              value: "{fields.contentId}"
              label: "{fields.meta.title} · {fields.publishing.status}"
          - name: knowledge
            label: 三个知识板块
            type: object
            fields:
              - name: learning
                label: 研究笔记精选（最多 3 条）
                type: reference
                options: { collection: learning_entries, multiple: true, max: 3, value: "{fields.contentId}", label: "{fields.meta.title} · {fields.publishing.status}" }
              - name: methods
                label: 方法指南精选（最多 3 条）
                type: reference
                options: { collection: method_entries, multiple: true, max: 3, value: "{fields.contentId}", label: "{fields.meta.title} · {fields.publishing.status}" }
              - name: resources
                label: 工具与资源精选（最多 3 条）
                type: reference
                options: { collection: resource_entries, multiple: true, max: 3, value: "{fields.contentId}", label: "{fields.meta.title} · {fields.publishing.status}" }

      - name: home_videos
        label: 首页视频案例
        type: file
        path: .shared/content/videos.json
        format: json
        operations: { delete: false }
        fields:
          - name: items
            label: 视频案例（最多 4 条，拖动即可调整首页顺序）
            type: object
            list:
              max: 4
              collapsible: { collapsed: true, summary: "{index}. {title}" }
            fields:
              - { name: id, label: 案例编号, type: uuid, hidden: true }
              - { name: published, label: 在首页显示, type: boolean, default: false }
              - { name: title, label: 标题, type: string, required: true }
              - name: category
                label: 类型
                type: select
                required: true
                options:
                  values:
                    - { label: 三维渲染视频, value: 三维渲染视频 }
                    - { label: AI 制作视频, value: AI 制作视频 }
                    - { label: 品牌视觉视频, value: 品牌视觉视频 }
                    - { label: 其他动态视觉, value: 其他动态视觉 }
              - { name: description, label: 案例说明, type: text, required: true }
              - name: poster
                label: 视频封面与缩略图（建议 1600×900）
                description: 用于首页主画面；配置多条视频时也用于下方切换缩略卡。
                type: image
                required: true
                options: { media: images }
              - name: url
                label: 视频来源
                description: 可保留哔哩哔哩链接，或把兼容的 MP4 直接上传到香港 OSS。
                type: oss-video
              - { name: duration, label: 时长（例如 00:36）, type: string }

      - name: about_page
        label: 关于我页面
        type: file
        path: .shared/content/aboutPage.json
        format: json
        operations: { delete: false }
        fields:
          - name: home
            label: 首页关于我摘要
            type: object
            required: true
            fields:
              - { name: title, label: 标题, type: string, required: true }
              - { name: description, label: 说明, type: text, required: true }
              - name: highlights
                label: 三项能力摘要
                type: object
                required: true
                list:
                  min: 3
                  max: 3
                  collapsible: { collapsed: true, summary: "{index}. {title}" }
                fields:
                  - { name: metric, label: 关键词 / 数字, type: string, required: true }
                  - { name: title, label: 标题, type: string, required: true }
                  - { name: description, label: 说明, type: text, required: true }
          - name: hero
            label: 关于页首屏
            type: object
            required: true
            fields:
              - { name: greeting, label: 姓名前引导语, type: string, required: true }
              - { name: title, label: 主定位, type: string, required: true }
              - { name: description, label: 简介, type: text, required: true }
              - { name: portrait, label: 人物主图, type: image, required: true, options: { media: images } }
              - { name: portraitAlt, label: 人物图片替代文字, type: string, required: true }
          - name: workbench
            label: 我的工作台
            type: object
            required: true
            fields:
              - { name: title, label: 板块标题, type: string, required: true }
              - { name: description, label: 板块说明, type: text, required: true }
              - name: capabilities
                label: 能力选项（可拖动排序）
                type: object
                required: true
                list:
                  min: 1
                  max: 8
                  collapsible: { collapsed: true, summary: "{index}. {title}" }
                fields:
                  - { name: id, label: 英文标识, type: string, required: true }
                  - { name: title, label: 能力名称, type: string, required: true }
                  - { name: icon, component: about_icon }
                  - { name: statement, label: 能力说明, type: text, required: true }
                  - { name: tools, label: 实际工具, type: text, required: true }
                  - { name: process, label: 负责环节, type: string, list: true, required: true }
                  - { name: output, label: 交付结果, type: text, required: true }
          - name: delivery
            label: 完整交付流程
            type: object
            required: true
            fields:
              - { name: title, label: 板块标题, type: string, required: true }
              - { name: description, label: 板块说明, type: text, required: true }
              - name: stages
                label: 交付阶段（可拖动排序）
                type: object
                required: true
                list:
                  min: 1
                  max: 4
                  collapsible: { collapsed: true, summary: "{index}. {title}" }
                fields:
                  - { name: title, label: 阶段标题, type: string, required: true }
                  - { name: description, label: 阶段说明, type: text, required: true }
                  - name: items
                    label: 阶段能力
                    type: object
                    required: true
                    list:
                      min: 1
                      max: 4
                      collapsible: { collapsed: true, summary: "{index}. {title}" }
                    fields:
                      - { name: title, label: 能力名称, type: string, required: true }
                      - { name: detail, label: 产出说明, type: text, required: true }
                      - { name: icon, component: about_icon }
          - name: resume
            label: 职业履历
            type: object
            required: true
            fields:
              - { name: title, label: 板块标题, type: string, required: true }
              - { name: description, label: 板块说明, type: text, required: true }
              - name: metrics
                label: 履历摘要指标
                type: object
                required: true
                list:
                  min: 1
                  max: 4
                  collapsible: { collapsed: true, summary: "{index}. {value} · {label}" }
                fields:
                  - { name: icon, component: resume_metric_icon }
                  - { name: value, label: 数字或关键词, type: string, required: true }
                  - { name: label, label: 指标说明, type: string, required: true }
              - name: experience
                label: 近期工作经历
                type: object
                required: true
                list:
                  min: 1
                  max: 4
                  collapsible: { collapsed: true, summary: "{index}. {period} · {company}" }
                fields:
                  - { name: period, label: 时间, type: string, required: true }
                  - { name: company, label: 公司, type: string, required: true }
                  - { name: role, label: 职位, type: string, required: true }
                  - { name: summary, label: 职责摘要, type: text, required: true }
                  - { name: achievements, label: 关键成果, type: text, list: true, required: true }
              - name: project
                label: 代表项目
                type: object
                required: true
                fields:
                  - { name: year, label: 项目年份, type: string, required: true }
                  - { name: title, label: 项目名称, type: string, required: true }
                  - { name: role, label: 项目角色, type: string, required: true }
                  - { name: summary, label: 项目摘要, type: text, required: true }
                  - { name: outcomes, label: 项目成果, type: text, list: true, required: true }
              - { name: skillsTitle, label: 能力组合标题, type: string, required: true }
              - name: skills
                label: 能力组合
                type: object
                required: true
                list:
                  min: 1
                  max: 4
                  collapsible: { collapsed: true, summary: "{index}. {title}" }
                fields:
                  - { name: title, label: 能力分类, type: string, required: true }
                  - { name: items, label: 能力标签, type: string, list: true, required: true }
              - name: education
                label: 教育背景
                type: object
                required: true
                fields:
                  - { name: school, label: 学校, type: string, required: true }
                  - { name: major, label: 专业, type: string, required: true }
              - name: recognition
                label: 近期荣誉
                type: object
                required: true
                fields:
                  - { name: title, label: 荣誉名称, type: string, required: true }
                  - { name: year, label: 时间与来源, type: string, required: true }
              - name: cta
                label: 求职联系行动区
                type: object
                required: true
                fields:
                  - { name: title, label: 标题, type: string, required: true }
                  - { name: description, label: 说明, type: text, required: true }

      - name: profile
        label: 基础资料与联系
        type: file
        path: .shared/content/profile.json
        format: json
        operations: { delete: false }
        fields:
          - { name: name, label: 姓名, type: string, required: true }
          - { name: email, label: 合作邮箱, type: string, required: true }
          - { name: resumePdf, label: 个人简历 PDF（可选）, type: file, options: { media: documents, extensions: [pdf] } }

      - name: knowledge_hub_cards
        label: 知识库总览
        type: file
        path: .shared/content/knowledgeHubCards.json
        format: json
        operations: { delete: false }
        fields:
          - name: items
            label: 三个栏目卡片
            type: object
            list: { collapsible: { collapsed: true, summary: "{index}. {title}" } }
            fields:
              - { name: id, label: 英文标识, type: string, required: true }
              - { name: title, label: 标题, type: string, required: true }
              - { name: description, label: 说明, type: text, required: true }
              - { name: link, label: 栏目链接, type: string, required: true }
              - { name: linkLabel, label: 链接按钮文字, type: string }
              - { name: tags, label: 标签, type: string, list: true }
              - { name: imageSubject, label: 图片占位说明, type: string }
              - { name: imageFilename, label: 图片文件名, type: string }

      - name: faq
        label: 常见问题 FAQ
        type: file
        path: .shared/content/faq.json
        format: json
        operations: { delete: false }
        fields:
          - name: items
            label: 问题列表（列表顺序即前台顺序）
            type: object
            list: { collapsible: { collapsed: true, summary: "{index}. {question}" } }
            fields:
              - { name: id, label: 问题编号, type: uuid, required: true }
              - name: category
                label: 问题分类
                type: select
                required: true
                options:
                  values:
                    - { label: 合作咨询, value: cooperation }
                    - { label: 资源下载, value: resources }
                    - { label: 网站使用, value: site }
              - { name: question, label: 问题, type: string, required: true }
              - { name: answer, label: 答案, type: text, required: true }
              - { name: link, label: 可选链接, type: string }
              - { name: linkLabel, label: 链接文字, type: string }
              - { name: published, label: 前台显示, type: boolean, default: true }
