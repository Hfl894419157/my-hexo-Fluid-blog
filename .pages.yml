media:
  - name: images
    label: 网站图片
    input: public/images/uploads
    output: /images/uploads
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif, svg]
    rename: safe
  - name: documents
    label: 简历与文档
    input: public/files
    output: /files
    categories: [document]
    extensions: [pdf]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "新增内容：{path}"
      update: "更新内容：{path}"
      rename: "调整内容地址：{oldPath} -> {newPath}"

components:
  content_id:
    label: 内容唯一编号
    type: uuid
    required: true
    hidden: true
    options:
      editable: false
      generate: false

  content_meta:
    label: 基本信息
    type: object
    required: true
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 卡片摘要
        type: text
        required: true
      - name: tags
        label: 标签
        type: string
        list: true

  content_publishing:
    label: 发布设置
    type: object
    required: true
    fields:
      - name: createdAt
        label: 创建日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: status
        label: 发布状态
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: 草稿（不公开）
            - name: planned
              label: 筹备中（显示占位卡）
            - name: published
              label: 已发布
            - name: archived
              label: 已归档（不公开）
      - name: verificationStatus
        label: 验证状态
        type: select
        default: 已整理
        options:
          values: [探索中, 已整理, 已验证, 长期维护]
      - name: showInRecentUpdates
        label: 计入首页最近更新
        type: boolean
        default: true

  content_cover:
    label: 卡片与封面
    type: object
    fields:
      - name: src
        label: 封面图片
        type: image
        options:
          media: images
      - name: alt
        label: 封面替代文字
        type: string
      - name: focalPoint
        label: 封面焦点位置
        description: 自动裁剪时保留的主体位置；旧内容默认居中。
        type: select
        default: center
        options:
          values:
            - { label: 左上, value: top-left }
            - { label: 上, value: top }
            - { label: 右上, value: top-right }
            - { label: 左, value: left }
            - { label: 中, value: center }
            - { label: 右, value: right }
            - { label: 左下, value: bottom-left }
            - { label: 下, value: bottom }
            - { label: 右下, value: bottom-right }
      - name: homeOverrideSrc
        label: 首页专用封面（可选）
        description: 仅在自动裁剪不理想时上传；留空会继续使用上方原图。
        type: image
        options:
          media: images

  content_seo:
    label: 高级设置
    type: object
    fields:
      - name: title
        label: SEO 标题（可选）
        type: string
      - name: description
        label: SEO 描述（可选）
        type: text

  project_meta:
    label: 项目资料（可选）
    type: object
    fields:
      - { name: role, label: 我的角色, type: string }
      - { name: year, label: 项目年份, type: string }
      - { name: client, label: 客户 / 品牌, type: string }
      - { name: services, label: 服务内容, type: string, list: true }
      - { name: outcome, label: 项目成果, type: text }

  resource_meta:
    label: 资源属性
    type: object
    fields:
      - name: type
        label: 资源类型
        type: select
        required: true
        default: other
        options:
          values:
            - { label: 软件, value: software }
            - { label: AI 工具, value: ai-tool }
            - { label: 插件, value: plugin }
            - { label: Prompt, value: prompt }
            - { label: 模板, value: template }
            - { label: 素材, value: asset }
            - { label: 文档, value: document }
            - { label: 其他, value: other }
      - name: access
        label: 获取方式
        type: select
        required: true
        default: contact
        options:
          values:
            - { label: 访问官网, value: official }
            - { label: 网盘下载, value: cloud }
            - { label: 联系获取, value: contact }
      - { name: platform, label: 平台 / 来源, type: string }
      - { name: licenseNote, label: 授权与版权说明, type: text }

  enrichment_state:
    label: 识别记录
    type: object
    hidden: true
    fields:
      - { name: sourceHash, label: 来源指纹, type: string }
      - { name: status, label: 识别状态, type: string }
      - { name: message, label: 识别说明, type: text }
      - name: autoValues
        label: 上次自动字段
        type: object
        fields:
          - { name: url, type: string }
          - { name: platform, type: string }
          - { name: title, type: string }
          - { name: summary, type: text }
          - { name: tags, type: string, list: true }
          - { name: platformCover, type: string }
          - { name: duration, type: string }
          - { name: aspect, type: string }
          - { name: code, type: string }
          - { name: name, type: string }
          - { name: format, type: string }
          - { name: size, type: string }

  content_blocks:
    label: 内容模块
    description: 可新增、复制、排序、折叠或删除模块；模块标识由系统自动生成。
    type: block
    blockKey: type
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {type}"
    blocks:
      - name: richText
        label: 高保真图文
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: format
            label: 正文格式
            type: string
            hidden: true
            default: html
          - name: html
            label: 图文正文
            description: 支持整篇富文本粘贴、图片粘贴及 Editor / Source 切换；外部图片会由增强后台自动归档。
            type: rich-text
            required: true
            options:
              format: html
              switcher: true
              media: images
              path: public/images/uploads/imported
              rename: random
          - name: legacyMarkdown
            label: 迁移前 Markdown（回退）
            type: text
            hidden: true
            readonly: true
      - name: image
        label: 单张图片
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: src
            label: 图片
            type: image
            required: true
            options:
              media: images
          - name: alt
            label: 替代文字
            type: string
            required: true
          - name: caption
            label: 图片说明
            type: text
      - name: gallery
        label: 图片组
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: items
            label: 图片列表
            type: object
            list:
              batch: true
              collapsible:
                collapsed: true
                summary: "{index}. {alt}"
            fields:
              - name: src
                label: 图片
                type: image
                required: true
                options:
                  media: images
              - name: alt
                label: 替代文字
                type: string
                required: true
              - name: caption
                label: 图片说明
                type: text
      - name: video
        label: 视频
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: rawInput
            label: 原始分享文案
            type: text
          - name: url
            label: 视频链接
            type: string
          - name: platform
            label: 平台
            type: select
            options:
              values: [youtube, bilibili, tencent, youku, douyin, xiaohongshu, wechat, external]
          - name: title
            label: 视频标题
            type: string
          - name: summary
            label: 视频说明
            type: text
          - name: tags
            label: 视频标签
            type: string
            list: true
          - name: platformCover
            label: 自动封面
            type: image
            options:
              media: images
          - name: customCover
            label: 自定义封面（优先）
            type: image
            options:
              media: images
          - name: duration
            label: 时长
            type: string
          - name: aspect
            label: 画面比例
            type: select
            default: "16:9"
            options:
              values: ["16:9", "4:3", "1:1", "9:16"]
          - { name: _enrichment, component: enrichment_state }
      - name: download
        label: 网盘资源
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: rawInput
            label: 原始分享文案
            type: text
          - name: url
            label: 分享链接
            type: string
          - name: platform
            label: 网盘平台
            type: select
            options:
              values: [baidu, aliyun, quark, pan123, lanzou, external]
          - name: code
            label: 提取码 / 访问码
            type: string
          - name: name
            label: 资源名称
            type: string
          - name: summary
            label: 资源说明
            type: text
          - name: format
            label: 文件格式
            type: string
          - name: size
            label: 文件大小
            type: string
          - name: platformCover
            label: 自动封面
            type: image
            options:
              media: images
          - name: customCover
            label: 自定义封面（优先）
            type: image
            options:
              media: images
          - name: buttonLabel
            label: 按钮文字
            type: string
            default: 打开资源
          - { name: _enrichment, component: enrichment_state }
      - name: externalLink
        label: 外部链接卡片
        fields:
          - name: id
            label: 模块标识
            type: uuid
            hidden: true
          - name: url
            label: 链接
            type: string
          - name: title
            label: 标题
            type: string
          - name: summary
            label: 说明
            type: text
          - name: cover
            label: 封面
            type: image
            options:
              media: images
          - name: buttonLabel
            label: 按钮文字
            type: string
            default: 访问链接

  portfolio_content_blocks:
    label: 作品内容
    description: 建议使用“作品图片组”；组内图片可新增、删除、折叠和拖动排序，列表顺序就是前台顺序。
    type: block
    blockKey: type
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {type}"
    blocks:
      - name: richText
        label: 作品说明（可选）
        fields:
          - { name: id, label: 模块标识, type: uuid, hidden: true }
          - { name: format, label: 正文格式, type: string, hidden: true, default: html }
          - name: html
            label: 图文正文
            type: rich-text
            required: true
            description: 支持整篇富文本粘贴、图片粘贴及 Editor / Source 切换；外部图片会由增强后台自动归档。
            options: { format: html, switcher: true, media: images, path: public/images/uploads/imported, rename: random }
          - { name: legacyMarkdown, label: 迁移前 Markdown（回退）, type: text, hidden: true, readonly: true }
      - name: image
        label: 单张通栏图片
        fields:
          - { name: id, label: 模块标识, type: uuid, hidden: true }
          - { name: src, label: 图片, type: image, required: true, options: { media: images } }
          - { name: alt, label: 替代文字, type: string, required: true }
          - { name: caption, label: 图片说明, type: text }
      - name: gallery
        label: 作品图片组
        fields:
          - { name: id, label: 模块标识, type: uuid, hidden: true }
          - name: items
            label: 作品图片（可拖动排序）
            type: object
            required: true
            list:
              min: 1
              batch: true
              collapsible:
                collapsed: true
                summary: "{index}. {alt} · {layout}"
            fields:
              - { name: id, label: 图片标识, type: uuid, hidden: true }
              - { name: src, label: 图片, type: image, required: true, options: { media: images } }
              - { name: alt, label: 替代文字, type: string, required: true }
              - { name: caption, label: 图片说明（可选）, type: text }
              - name: layout
                label: 展示宽度
                description: 自动会根据图片横竖比例选择宽度；手机端统一通栏。
                type: select
                required: true
                default: auto
                options:
                  values:
                    - { label: 智能自动, value: auto }
                    - { label: 三分之一, value: third }
                    - { label: 二分之一, value: half }
                    - { label: 三分之二, value: two-thirds }
                    - { label: 整行通栏, value: full }

content:
  - name: cases
    label: 作品集
    type: collection
    path: portfolio
    exclude: [index.md]
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: true
    operations: { create: true, rename: true, delete: true }
    actions:
      - name: enrich-content
        label: 识别内容模块
        scope: entry
        workflow: enrich-content.yml
        ref: current
        cancelable: false
        confirm:
          title: 识别当前内容模块？
          message: 请先保存草稿。全部重新识别会覆盖可自动识别字段，但不会覆盖自定义封面。
          button: 开始识别
        fields:
          - name: mode
            label: 识别方式
            type: select
            required: true
            default: fill_empty
            options:
              - { label: 仅补充空白（推荐）, value: fill_empty }
              - { label: 更新未被人工修改的自动字段, value: refresh_auto }
              - { label: 全部重新识别, value: overwrite_all }
      - name: duplicate-content
        label: 复制为新草稿
        scope: entry
        workflow: duplicate-content.yml
        ref: current
        cancelable: false
        confirm:
          title: 复制当前作品为新草稿？
          message: 系统会重新生成内容编号和模块编号，不会覆盖原作品。
          button: 创建副本
        fields:
          - { name: title, label: 新标题, type: text, required: true }
          - { name: filename, label: 新文件名（小写英文、数字、短横线）, type: text, required: true }

    view:
      primary: meta.title
      fields: [meta.title, publishing.status, publishing.createdAt, publishing.verificationStatus]
      sort: [publishing.createdAt, meta.title]
      search: [meta.title, meta.description, meta.tags]
      default: { sort: publishing.createdAt, order: desc }
    fields:
      - { name: contentId, component: content_id }
      - { name: meta, component: content_meta }
      - { name: publishing, component: content_publishing }
      - { name: cover, component: content_cover }
      - { name: project, component: project_meta }
      - { name: contentBlocks, component: portfolio_content_blocks }
      - { name: seo, component: content_seo }

  - name: workflows
    label: 工作流
    type: collection
    path: aigc
    exclude: [index.md]
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: true
    operations: { create: true, rename: true, delete: true }
    actions:
      - name: enrich-content
        label: 识别内容模块
        scope: entry
        workflow: enrich-content.yml
        ref: current
        cancelable: false
        confirm:
          title: 识别当前内容模块？
          message: 请先保存草稿。全部重新识别会覆盖可自动识别字段，但不会覆盖自定义封面。
          button: 开始识别
        fields:
          - name: mode
            label: 识别方式
            type: select
            required: true
            default: fill_empty
            options:
              - { label: 仅补充空白（推荐）, value: fill_empty }
              - { label: 更新未被人工修改的自动字段, value: refresh_auto }
              - { label: 全部重新识别, value: overwrite_all }
      - name: duplicate-content
        label: 复制为新草稿
        scope: entry
        workflow: duplicate-content.yml
        ref: current
        cancelable: false
        confirm:
          title: 复制当前工作流为新草稿？
          message: 系统会重新生成内容编号和模块编号，不会覆盖原工作流。
          button: 创建副本
        fields:
          - { name: title, label: 新标题, type: text, required: true }
          - { name: filename, label: 新文件名（小写英文、数字、短横线）, type: text, required: true }

    view:
      primary: meta.title
      fields: [meta.title, publishing.status, publishing.createdAt, publishing.verificationStatus]
      sort: [publishing.createdAt, meta.title]
      search: [meta.title, meta.description, meta.tags]
      default: { sort: publishing.createdAt, order: desc }
    fields:
      - { name: contentId, component: content_id }
      - { name: meta, component: content_meta }
      - { name: publishing, component: content_publishing }
      - { name: cover, component: content_cover }
      - { name: contentBlocks, component: content_blocks }
      - { name: seo, component: content_seo }

  - name: knowledge_content
    label: 知识库内容
    type: group
    items:
      - name: learning_entries
        label: 研究笔记
        type: collection
        path: knowledge/learning-observation
        format: yaml-frontmatter
        filename:
          template: "{primary}.md"
          field: true
        operations: { create: true, rename: true, delete: true }
        actions:
          - name: enrich-content
            label: 识别内容模块
            scope: entry
            workflow: enrich-content.yml
            ref: current
            cancelable: false
            confirm:
