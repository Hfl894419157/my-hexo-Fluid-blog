  - name: homepage
    label: 首页内容管理
    type: file
    path: .shared/content/home.json
    format: json
    operations:
      delete: false
    fields:
      - name: featuredCases
        label: 首页案例精选（数量不限，列表顺序即展示顺序）
        type: reference
        options:
          collection: cases
          multiple: true
          search: "title,description,tags,status"
          value: "{path}"
          label: "{fields.title} · {fields.status}"
      - name: featuredWorkflows
        label: 精选工作流（最多 3 条）
        type: reference
        options:
          collection: workflows
          multiple: true
          max: 3
          search: "title,description,tags,status"
          value: "{path}"
          label: "{fields.title} · {fields.status}"
      - name: knowledge
        label: 三个知识板块
        type: object
        fields:
          - name: learning
            label: 学习与观察精选（最多 3 条）
            type: reference
            options:
              collection: learning_entries
              multiple: true
              max: 3
              search: "title,description,tags,sections,status"
              value: "{path}"
              label: "{fields.title} · {fields.status}"
          - name: methods
            label: 方法体系精选（最多 3 条）
            type: reference
            options:
              collection: method_entries
              multiple: true
              max: 3
              search: "title,description,tags,sections,status"
              value: "{path}"
              label: "{fields.title} · {fields.status}"
          - name: resources
            label: 资源库精选（最多 3 条）
            type: reference
            options:
              collection: resource_entries
              multiple: true
              max: 3
              search: "title,description,tags,sections,status"
              value: "{path}"
              label: "{fields.title} · {fields.status}"

