name: Upload generated images to Alibaba Cloud OSS
description: Uploads immutable AVIF and WebP build artifacts without deleting older objects.

inputs:
  bucket:
    description: Hong Kong OSS bucket name
    required: true
  access-key-id:
    description: RAM user AccessKey ID
    required: true
  access-key-secret:
    description: RAM user AccessKey secret
    required: true
  endpoint:
    description: OSS public endpoint
    required: false
    default: https://oss-cn-hongkong.aliyuncs.com

runs:
  using: composite
  steps:
    - name: Validate OSS deployment settings
      shell: bash
      env:
        OSS_BUCKET: ${{ inputs.bucket }}
        OSS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        OSS_ACCESS_KEY_SECRET: ${{ inputs.access-key-secret }}
      run: |
        test -n "$OSS_BUCKET" || { echo "::error::Missing repository variable ALIYUN_OSS_BUCKET"; exit 1; }
        test -n "$OSS_ACCESS_KEY_ID" || { echo "::error::Missing secret ALIYUN_OSS_ACCESS_KEY_ID"; exit 1; }
        test -n "$OSS_ACCESS_KEY_SECRET" || { echo "::error::Missing secret ALIYUN_OSS_ACCESS_KEY_SECRET"; exit 1; }
        test -d .vitepress/dist/_generated/images || { echo "::error::Generated image directory is missing"; exit 1; }

    - name: Install verified ossutil
      shell: bash
      run: |
        archive="$RUNNER_TEMP/ossutil-2.3.0-linux-amd64.zip"
        install_dir="$RUNNER_TEMP/ossutil"
        curl --fail --silent --show-error --location \
          --output "$archive" \
          https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
        echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  $archive" | sha256sum --check
        mkdir -p "$install_dir"
        unzip -q "$archive" -d "$install_dir"
        binary="$(find "$install_dir" -type f -name ossutil -print -quit)"
        test -n "$binary" || { echo "::error::ossutil binary was not found after extraction"; exit 1; }
        chmod 755 "$binary"
        echo "OSSUTIL_BINARY=$binary" >> "$GITHUB_ENV"

    - name: Upload immutable image variants
      shell: bash
      env:
        OSS_BUCKET: ${{ inputs.bucket }}
        OSS_ENDPOINT: ${{ inputs.endpoint }}
        OSS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        OSS_ACCESS_KEY_SECRET: ${{ inputs.access-key-secret }}
      run: |
        config_file="$RUNNER_TEMP/ossutilconfig"
        trap 'rm -f "$config_file"' EXIT
        umask 077
        printf '[Credentials]\nlanguage = EN\nendpoint = %s\naccessKeyID = %s\naccessKeySecret = %s\n' \
          "$OSS_ENDPOINT" "$OSS_ACCESS_KEY_ID" "$OSS_ACCESS_KEY_SECRET" > "$config_file"
        destination="oss://$OSS_BUCKET/_generated/images/"
        cache_control="public, max-age=31536000, immutable"
        "$OSSUTIL_BINARY" -c "$config_file" cp -r \
          .vitepress/dist/_generated/images/ "$destination" \
          --include "*.avif" \
          --cache-control "$cache_control" \
          --content-type "image/avif" \
          --ignore-existing --force --no-progress
        "$OSSUTIL_BINARY" -c "$config_file" cp -r \
          .vitepress/dist/_generated/images/ "$destination" \
          --include "*.webp" \
          --cache-control "$cache_control" \
          --content-type "image/webp" \
          --ignore-existing --force --no-progress
