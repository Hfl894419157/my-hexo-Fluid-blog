name: Pages CMS 复制为新草稿

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pages-cms-duplicate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: 校验 Pages CMS 请求
        id: payload
        uses: actions/github-script@v8
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        with:
          script: |
            const payload = JSON.parse(process.env.PAGES_CMS_PAYLOAD || '{}')
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/')
            const allowedCollections = new Set(['cases', 'workflows', 'learning_entries', 'method_entries', 'resource_entries'])
            const pathPattern = /^(?:portfolio|aigc|knowledge\/(?:learning-observation|methods|resources))\/[a-z0-9-]+\.md$/
            const title = String(payload.inputs?.title || '').trim()
            const ref = String(payload.repository?.ref || '').replace(/^refs\/heads\//, '')
            const sha = String(payload.repository?.sha || '')
            const failures = []
            if (payload.source !== 'pages-cms') failures.push('请求来源不是 Pages CMS')
            if (payload.repository?.owner !== owner || payload.repository?.repo !== repo) failures.push('仓库信息不匹配')
            if (payload.context?.type !== 'entry' || !allowedCollections.has(payload.context?.name)) failures.push('Action 只能用于受管详情条目')
            if (!pathPattern.test(payload.context?.path || '')) failures.push('源文章路径不在允许范围')
            if (!title) failures.push('新标题不能为空')
            if (!/^[A-Za-z0-9._/-]+$/.test(ref) || ref.includes('..') || ref.startsWith('/') || ref.endsWith('/')) failures.push('分支名称无效')
            if (!/^[0-9a-f]{40}$/i.test(sha)) failures.push('提交号无效')
            if (failures.length) throw new Error(failures.join('；'))
            core.setOutput('source', payload.context.path)
            core.setOutput('ref', ref)
            core.setOutput('sha', sha)
            core.setOutput('title', title)

      - name: 拉取触发时的精确提交
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.payload.outputs.sha }}
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 确认分支未前进
        env:
          TARGET_REF: ${{ steps.payload.outputs.ref }}
          EXPECTED_SHA: ${{ steps.payload.outputs.sha }}
        run: |
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | cut -f1)"
          test "$REMOTE_SHA" = "$EXPECTED_SHA" || { echo "分支已产生新提交，请在 Pages CMS 刷新后重试。"; exit 1; }

      - name: 安装依赖
        run: npm ci

      - name: 创建安全草稿副本
        id: duplicate
        env:
          SOURCE_PATH: ${{ steps.payload.outputs.source }}
          NEW_TITLE: ${{ steps.payload.outputs.title }}
        run: |
          TARGET_PATH="$(node scripts/duplicate-content.mjs --source "$SOURCE_PATH" --title "$NEW_TITLE")"
          echo "path=$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: 运行内容检查
        run: |
          npm run content:test
          npm run content:check
          npm run build

      - name: 提交并安全推送
        env:
          TARGET_PATH: ${{ steps.duplicate.outputs.path }}
          TARGET_REF: ${{ steps.payload.outputs.ref }}
          EXPECTED_SHA: ${{ steps.payload.outputs.sha }}
        run: |
          git add -- "$TARGET_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "复制内容为草稿：$TARGET_PATH"
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | cut -f1)"
          test "$REMOTE_SHA" = "$EXPECTED_SHA" || { echo "分支在复制期间已前进，已安全停止，未强推。"; exit 1; }
          git push origin "HEAD:refs/heads/$TARGET_REF"
