name: Deploy VitePress site to Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/images/uploads/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      - name: 检查内容结构与首页选择
        run: |
          npm run enrichment:test
          npm run content:test
          npm run content:check
      - name: 构建静态文件
        run: npm run build
        env:
          SITE_VERSION: ${{ github.sha }}
      - name: 生成 Cloudflare 精确清理清单
        run: node scripts/build-cloudflare-purge-list.mjs
      - name: 上传产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist
      - name: 上传 Cloudflare 清理清单
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-purge-list
          path: .vitepress/cache/cloudflare-purge-urls.json
          if-no-files-found: error
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取缓存清理脚本
        uses: actions/checkout@v4
      - name: 部署到Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: 下载 Cloudflare 清理清单
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-purge-list
          path: .cloudflare-purge
      - name: 精确清理 Cloudflare CDN 页面缓存
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-cache.mjs --manifest .cloudflare-purge/cloudflare-purge-urls.json
