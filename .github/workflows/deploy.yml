name: Deploy VitePress site to Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/images/uploads/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      - name: 检查内容结构与首页选择
        run: |
          npm run enrichment:test
          npm run content:test
          npm run content:check
      - name: 构建静态文件
        run: npm run build
        env:
          SITE_VERSION: ${{ github.sha }}
      - name: 上传产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: 清理 Cloudflare CDN 缓存
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 Cloudflare Secrets，跳过缓存清理。"
            exit 0
          fi
          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          RESPONSE="$response" node -e "const body=JSON.parse(process.env.RESPONSE); if (!body.success) { console.error(body.errors); process.exit(1) }"
